<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>揭露事項聲明書 產生器</title>
<style>
  :root{--navy:#1F3A5F;--navy2:#16293f;--gold:#C8A45C;--ink:#e9eff6;--mut:#9fb0c4;--ok:#3FB37F;--err:#E5736B;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--navy2);color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;}
  .wrap{max-width:520px;margin:0 auto;padding:22px 18px 40px;}
  .card{background:linear-gradient(180deg,#22405f 0%,#1b3350 100%);
    border:1px solid rgba(200,164,92,.28);border-radius:16px;padding:20px 18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.5px;}
  h1 .g{color:var(--gold);}
  .sub{color:var(--mut);font-size:13px;margin:0 0 18px;}
  label{display:block;font-size:13px;color:var(--gold);margin:16px 0 7px;letter-spacing:.5px;}
  input[type=text]{width:100%;font-size:22px;letter-spacing:1px;padding:14px 14px;
    background:#0f2034;border:1.5px solid rgba(200,164,92,.4);border-radius:12px;color:#fff;
    text-align:center;outline:none;}
  input[type=text]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,92,.18);}
  .hint{font-size:12px;color:var(--mut);margin-top:7px;line-height:1.6;}
  .hint b{color:#cdd9e6;font-weight:600;}
  button{width:100%;margin-top:20px;padding:16px;font-size:18px;font-weight:700;letter-spacing:2px;
    background:var(--gold);color:#1b2c44;border:none;border-radius:12px;cursor:pointer;}
  button:active{transform:translateY(1px);filter:brightness(.95);}
  button:disabled{opacity:.5;}
  .preview{margin-top:18px;padding:14px;border:1px dashed rgba(200,164,92,.35);border-radius:12px;
    font-size:14px;line-height:1.9;background:rgba(15,32,52,.5);display:none;}
  .preview.show{display:block;}
  .preview .k{color:var(--mut);font-size:12px;}
  .preview .v{color:#fff;font-size:15px;}
  .msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px;}
  .msg.ok{color:var(--ok);}
  .msg.err{color:var(--err);}
  .foot{margin-top:22px;color:var(--mut);font-size:11.5px;line-height:1.7;text-align:center;}
  .today{color:var(--gold);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>揭露事項聲明書 <span class="g">產生器</span></h1>
    <p class="sub">臺灣基隆地方法院民事執行處・不動產鑑定人</p>

    <label>輸入案號</label>
    <input id="case" type="text" inputmode="text" autocomplete="off"
           placeholder="115誠13579" />
    <div class="hint">
      格式：<b>年度＋股別＋案號</b>（免空格）<br>
      例：<b>115誠13579</b> → 115年度司執誠股字第13579號<br>
      日期自動帶今天：<span id="todayTxt" class="today"></span>
    </div>

    <button id="go">產生並下載 Word 檔</button>

    <div id="preview" class="preview">
      <div class="k">案號</div><div id="pvCase" class="v"></div>
      <div class="k" style="margin-top:8px">日期</div><div id="pvDate" class="v"></div>
    </div>
    <div id="msg" class="msg"></div>

    <div class="foot">
      離線可用・產生後請用手機 Word／Gmail 附檔傳給法院<br>
      姓名、通訊處、印章固定於範本內
    </div>
  </div>
</div>

function rocToday(){
  const d=new Date();
  return {y:d.getFullYear()-1911, m:String(d.getMonth()+1).padStart(2,'0'),
          d:String(d.getDate()).padStart(2,'0')};
}
function nfkc(s){return s.normalize('NFKC').trim();}
function parseCase(s){
  s=nfkc(s).replace(/\s+/g,'');
  const m=s.match(/^(\d+)([^\d]+?)(\d+)$/);
  if(!m) return null;
  return {year:m[1], stock:m[2], num:m[3]};
}

const t=rocToday();
document.getElementById('todayTxt').textContent=`中華民國${t.y}年${t.m}月${t.d}日`;

const inp=document.getElementById('case');
const pv=document.getElementById('preview');
const msg=document.getElementById('msg');

function refreshPreview(){
  const p=parseCase(inp.value);
  if(p){
    document.getElementById('pvCase').textContent=`${p.year}年度司執${p.stock}股字第${p.num}號`;
    document.getElementById('pvDate').textContent=`中華民國${t.y}年${t.m}月${t.d}日`;
    pv.classList.add('show');
  }else{
    pv.classList.remove('show');
  }
}
inp.addEventListener('input',()=>{msg.textContent='';refreshPreview();});

async function generate(){
  msg.className='msg'; msg.textContent='';
  const p=parseCase(inp.value);
  if(!p){msg.className='msg err';msg.textContent='格式錯誤，請輸入如 115誠13579';return;}
  try{
    const zip=await JSZip.loadAsync(TPL_B64,{base64:true});
    let xml=await zip.file("word/document.xml").async("string");
    const map={'__CY__':p.year,'__G__':p.stock,'__N__':p.num,
               '__RY__':String(t.y),'__MM__':t.m,'__DD__':t.d};
    for(const k in map){ xml=xml.split(k).join(map[k]); }
    zip.file("word/document.xml",xml);
    const blob=await zip.generateAsync({type:"blob",
      mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    const fname=`揭露事項聲明書_${p.year}${p.stock}${p.num}.docx`;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=fname; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    msg.className='msg ok'; msg.textContent='✓ 已產生：'+fname;
  }catch(e){
    msg.className='msg err'; msg.textContent='產生失敗：'+(e.message||e);
  }
}
document.getElementById('go').addEventListener('click',generate);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')generate();});
</script>
