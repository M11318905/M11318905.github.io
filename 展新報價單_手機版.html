<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>展新報價單 產生器</title>
<style>
  :root{--navy:#1F3A5F;--navy2:#16293f;--gold:#C8A45C;--ink:#e9eff6;--mut:#9fb0c4;--ok:#3FB37F;--err:#E5736B;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--navy2);color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;}
  .wrap{max-width:540px;margin:0 auto;padding:20px 16px 48px;}
  .card{background:linear-gradient(180deg,#22405f,#1b3350);
    border:1px solid rgba(200,164,92,.28);border-radius:16px;padding:20px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);}
  h1{font-size:19px;margin:0 0 2px;}h1 .g{color:var(--gold);}
  .sub{color:var(--mut);font-size:13px;margin:0 0 14px;}
  label{display:block;font-size:13px;color:var(--gold);margin:14px 0 6px;letter-spacing:.4px;}
  input,select{width:100%;font-size:17px;padding:12px;background:#0f2034;color:#fff;
    border:1.4px solid rgba(200,164,92,.38);border-radius:10px;outline:none;}
  input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,92,.16);}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
    background-position:calc(100% - 18px) 19px,calc(100% - 12px) 19px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;}
  .feewrap{position:relative;}
  .feeprev{margin-top:6px;font-size:14px;color:#fff;}
  .feeprev b{color:var(--gold);}
  .auto{font-size:12px;color:var(--mut);margin-top:6px;}
  .auto b{color:#cdd9e6;}
  button{width:100%;margin-top:22px;padding:16px;font-size:18px;font-weight:700;letter-spacing:2px;
    background:var(--gold);color:#1b2c44;border:none;border-radius:12px;cursor:pointer;}
  button:active{transform:translateY(1px);filter:brightness(.95);}
  .msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px;}
  .msg.ok{color:var(--ok);}.msg.err{color:var(--err);}
  .foot{margin-top:18px;color:var(--mut);font-size:11.5px;line-height:1.7;text-align:center;}
  .hide{display:none;}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>展新報價單 <span class="g">產生器</span></h1>
  <p class="sub">填好欄位，一鍵下載 Word・日期自動帶當天</p>

  <label>受文者</label>
  <input id="recip" type="text" placeholder="中國信託陳俊宏先生">

  <label>案號</label>
  <input id="caseno" type="text" placeholder="北院信113司執助光字第14709號">

  <label>債務人</label>
  <input id="debtor" type="text" placeholder="楊廣蔭等人(即楊敬業之繼承人)">

  <label>標的</label>
  <input id="target" type="text" placeholder="新北市新店區德正街27巷29弄139號2樓">

  <label>報告類型</label>
  <select id="rpt">
    <option>地方法院</option>
    <option>銀行</option>
    <option>法拍</option>
    <option>一般委託</option>
    <option value="__other__">其他（自行輸入）</option>
  </select>
  <input id="rptOther" class="hide" type="text" placeholder="自行輸入報告類型" style="margin-top:8px">

  <label>鑑價費用（只填數字）</label>
  <div class="feewrap">
    <input id="fee" type="text" inputmode="numeric" placeholder="8000">
    <div class="feeprev">將顯示為：<b id="feePrev">$0</b></div>
  </div>

  <label>備註</label>
  <select id="remark">
    <option>請回傳債務人身分證字號</option>
    <option>(謄本、地籍圖、平面圖)</option>
    <option>無</option>
    <option value="__other__">其他（自行輸入）</option>
  </select>
  <input id="remarkOther" class="hide" type="text" placeholder="自行輸入備註" style="margin-top:8px">

  <div class="auto">發文日期／落款日期自動帶：<b id="todayTxt"></b></div>

  <button id="go">產生並下載報價單</button>
  <div id="msg" class="msg"></div>
  <div class="foot">離線可用・產出後用手機 Word／Gmail 附檔寄出<br>抬頭、銀行帳號、統編、信箱、附註固定於範本</div>
</div></div>

function roc(){const d=new Date();return{y:d.getFullYear()-1911,m:d.getMonth()+1,d:d.getDate()};}
const T=roc();
const issueStr=`民國${T.y}年${T.m}月${T.d}日`;
const bottomStr=`中華民國${T.y}年${T.m}月${T.d}日`;
document.getElementById('todayTxt').textContent=bottomStr;

function fmtFee(raw){
  const n=(raw||'').replace(/[^\d]/g,'');
  if(!n) return '';
  return '$'+Number(n).toLocaleString('en-US');
}
const fee=document.getElementById('fee'), feePrev=document.getElementById('feePrev');
fee.addEventListener('input',()=>{feePrev.textContent=fmtFee(fee.value)||'$0';});

function bindOther(selId,inpId){
  const s=document.getElementById(selId),i=document.getElementById(inpId);
  s.addEventListener('change',()=>{ if(s.value==='__other__'){i.classList.remove('hide');i.focus();}else{i.classList.add('hide');}});
}
bindOther('rpt','rptOther'); bindOther('remark','remarkOther');

function val(id){return document.getElementById(id).value.trim();}
function selVal(selId,inpId){const s=document.getElementById(selId);return s.value==='__other__'?val(inpId):s.value;}

async function generate(){
  const msg=document.getElementById('msg'); msg.className='msg'; msg.textContent='';
  const map={
    '__RECIP__':val('recip'),
    '__CASE__':val('caseno'),
    '__DEBTOR__':val('debtor'),
    '__TARGET__':val('target'),
    '__RPT__':selVal('rpt','rptOther'),
    '__FEE__':fmtFee(fee.value),
    '__REMARK__':selVal('remark','remarkOther'),
    '__ISSUE__':issueStr,
    '__BOTTOM__':bottomStr
  };
  try{
    const zip=await JSZip.loadAsync(TPL_B64,{base64:true});
    let xml=await zip.file("word/document.xml").async("string");
    for(const k in map){ xml=xml.split(k).join(map[k]); }
    zip.file("word/document.xml",xml);
    const blob=await zip.generateAsync({type:"blob",
      mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    const tag=(val('recip')||bottomStr).replace(/[\\/:*?"<>|]/g,'');
    const fname=`展新報價單_${tag}.docx`;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    msg.className='msg ok'; msg.textContent='✓ 已產生：'+fname;
  }catch(e){ msg.className='msg err'; msg.textContent='產生失敗：'+(e.message||e); }
}
document.getElementById('go').addEventListener('click',generate);
</script>
